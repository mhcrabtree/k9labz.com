        { title: "Fear Is Not a Legal Reason", meta: "Law", text: "The Department of Justice states that \"allergies and fear of dogs are not valid reasons for denying access or refusing service to people using service animals.\"[1] Its FAQ adds that a business or government may not exclude a service animal \"because of fears or generalizations about how an animal or breed might behave.\"[2] A service animal can be removed for only two reasons: it is out of control and the handler doesn't take effective action, or it isn't housebroken.[2]" },
        { title: "Know Which Rules Apply to You", meta: "Law", text: "Those protections cover service animals. A dog that is not a service animal falls under local park and leash rules, which vary by city.[3][4] Before you train in public, find out which rules cover your dog and read your city's code for the park you use." },
        { title: "The Public Often Doesn't Know", meta: "Statistic", text: "In a 2025 survey of more than 1,000 assistance dog handlers in 20 countries, 43% had been refused access to a public space in the previous 12 months.[5] The report ties those refusals to the public's \"limited understanding and misconceptions\" about assistance dogs, and one handler said a business refused entry because the dog \"would cause allergies to other customers.\"[5] Her fear is real to her, but it isn't the legal standard." }

        { title: "Calm Is Trainable and It Works", meta: "Statistic", text: "A cluster randomized trial in six Slovenian psychiatric hospitals found that wards where staff received verbal and non-verbal de-escalation training had 73% fewer aggressive events than wards that didn't.[6] A psychiatric ward is far from a park, so I treat this as support for the idea, not proof for my situation. Still, it shows that staying calm is a skill, and skills can be practiced." },
        { title: "Ignoring Her Didn't Calm Her", meta: "Experience", text: "In my case, the more I ignored her, the angrier she got. A short, polite sentence such as \"I'm working my dog, and I'll keep him close\" might have given her something to respond to. I didn't try it, so I can't say it would have worked." },
