        "Recently, I coached my son at the Cosmic Clash wrestling tournament at Denver's National Western Complex, with my yellow Labrador in a perfect heel at my side. Midway through the day, a security guard stopped me on the floor and asked to inspect my dog. He explained that staff were looking for a dog someone had reported as a fake service dog. He checked both sides of my dog's vest, found a patch from my trainer's business, and declared him \"credentialed.\"",

      ]

        { title: "Real Gear Serves a Task", meta: "Experience", text: "In my family, the gear follows the task. My dog wears a vest because his job requires it, and I use a specialized leash. My son's dog doesn't need a vest, but he wears one anyway because the public expects it." },

        { title: "Reliable Obedience", meta: "Law", text: "In my view, a dog can't be trusted with a critical task if it can't hold a sit, a stay, a heel, and a recall. That's why obedience is the first thing I look for. The law backs this up: a business can make a service dog leave if it is out of control and the handler doesn't regain control, or if it isn't housebroken.[5] Accredited programs train dogs to be stable, well-behaved, and unobtrusive in public.[6]" },
